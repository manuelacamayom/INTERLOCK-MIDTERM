<style>
:root{
  --bg:#fff; --text:#000; --pad:18px;
  --font:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --bar-h:112px; --zoom-ms:520ms;

  /* colors from your icons */
  --c-green:#7aa46d;
  --c-purple:#8161a7;
  --c-blue:#7dbec7;
  --c-coral:#c77c74;

  /* keep page titles clear of the fixed bar */
  --title-offset: calc(var(--bar-h) + 24px);
}

/* base */
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
*,*:before,*:after{box-sizing:border-box}
a{color:inherit;text-decoration:none}
img{user-drag:none; -webkit-user-drag:none}

/* ===== Top bar: centered ransom title ===== */
.bar{
  position:fixed; inset:0 0 auto 0; height:var(--bar-h);
  display:flex; align-items:flex-end; justify-content:center; gap:14px;
  background:#fff; border-bottom:1px solid #e9e9e9; z-index:200;   /* raised above page titles */
  padding:10px calc(var(--pad)*1.25) 8px;
}
.title{display:flex; gap:8px; align-items:flex-end}
.tile{
  display:inline-grid; place-items:center; padding:6px 10px;
  border-radius:6px; transform:translateY(14px) rotate(var(--r,0deg));
  box-shadow:0 4px 14px rgba(0,0,0,.10);
  background:var(--paper,#f4f2ee); opacity:0; transform-origin:bottom center;
  animation:tileIn .7s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes tileIn{to{opacity:1; transform:rotate(var(--r,0deg)) translateY(0)}}
.tile span{font-weight:700; line-height:1; font-size:clamp(30px,5vw,58px); letter-spacing:.02em}
.tile:nth-child(1) span{font-family:"Archivo Black",sans-serif}
.tile:nth-child(2) span{font-family:"Playfair Display",serif}
.tile:nth-child(3) span{font-family:"Oswald",sans-serif}
.tile:nth-child(4) span{font-family:"Abril Fatface",serif}
.tile:nth-child(5) span{font-family:"IBM Plex Serif",serif}
.tile:nth-child(6) span{font-family:"Oswald",sans-serif}
.tile:nth-child(7) span{font-family:"Archivo Black",sans-serif}
.tile:nth-child(8) span{font-family:"Abril Fatface",serif}
.tile:nth-child(9) span{font-family:"Playfair Display",serif}

/* alternating “paper” only for MAIN title */
.tile:nth-child(4n+1){--paper:color-mix(in oklab, var(--c-green) 24%, white)}
.tile:nth-child(4n+2){--paper:color-mix(in oklab, var(--c-purple) 24%, white)}
.tile:nth-child(4n+3){--paper:color-mix(in oklab, var(--c-blue) 24%, white)}
.tile:nth-child(4n+4){--paper:color-mix(in oklab, var(--c-coral) 24%, white)}
.tile:nth-child(1){--r:-2deg;  animation-delay:.02s}
.tile:nth-child(2){--r:1.6deg;  animation-delay:.08s}
.tile:nth-child(3){--r:-1.2deg; animation-delay:.14s}
.tile:nth-child(4){--r:2.3deg;  animation-delay:.20s}
.tile:nth-child(5){--r:-2.5deg; animation-delay:.26s}
.tile:nth-child(6){--r:1.1deg;  animation-delay:.32s}
.tile:nth-child(7){--r:-1.7deg; animation-delay:.38s}
.tile:nth-child(8){--r:2deg;    animation-delay:.44s}
.tile:nth-child(9){--r:-1.1deg; animation-delay:.50s}

/* Home icon button — icon only */
.home-chip{
  position:absolute; right:16px; top:8px; display:grid; place-items:center;
}
.home-chip img{width:110px; height:auto; display:block; cursor:pointer; filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}

/* pages */
main{padding-top:calc(var(--bar-h) + 2px)}
.page{display:none}
.page.active,.page:target{display:block}

/* ===== Home collage (assemble + boom) ===== */
.scene{position:relative; max-width:1600px; margin:6px auto 34px; padding:0 calc(var(--pad)*1.2)}
.puzzle{
  position:relative; width:100%; aspect-ratio:16/10; overflow:hidden; background:transparent;
  transform:scale(.965); animation:boom 900ms 700ms cubic-bezier(.2,.7,.18,1) forwards;
}
@keyframes boom{50%{transform:scale(1.04)} 100%{transform:scale(1)}}
.piece{
  position:absolute; width:33.3333%; height:50%;
  background-image:var(--img); background-size:300% 200%; background-repeat:no-repeat;
  opacity:0; transform:translate(var(--tx,0),var(--ty,0)) rotate(var(--rot,0deg)) scale(.98);
  transition:transform 1.05s cubic-bezier(.2,.7,.18,1), opacity .8s ease;
}
.puzzle.assembled .piece{opacity:1; transform:translate(0,0) rotate(0) scale(1)}
.piece{transition-delay:var(--delay,0ms)}
.p00{left:0%;        top:0%;    background-position:0%   0%}
.p10{left:33.3333%;  top:0%;    background-position:50%  0%}
.p20{left:66.6666%;  top:0%;    background-position:100% 0%}
.p01{left:0%;        top:50%;   background-position:0%   100%}
.p11{left:33.3333%;  top:50%;   background-position:50%  100%}
.p21{left:66.6666%;  top:50%;   background-position:100% 100%}

/* hotspots */
.hotspot{position:absolute; transform:translate(-50%,-50%); background:transparent; border:none; cursor:pointer}
.tag{display:flex; align-items:center; gap:8px; user-select:none; background:#fff; padding:6px 10px; border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.12); font:800 12px/1 "Inter",system-ui}
.dot{width:10px; height:10px; border-radius:50%; background:#ff5a5a; box-shadow:0 0 0 2px #fff inset, 0 0 0 1px #0002}
.scene.hotspots-hidden .hotspot{opacity:0; pointer-events:none; transition:opacity .4s ease}
.scene .hotspot{opacity:1; transition:opacity .4s ease}

/* zoom overlay for hotspot nav */
.zoom-overlay{position:fixed; inset:0; pointer-events:none; z-index:40; display:none}
.zoom-overlay.active{display:block}
.zoom-piece{position:absolute; will-change:transform; background:#fff}

/* ===== Collage pages (floating ransom title + huge canvas) ===== */
.desk-wrap{max-width:1600px; margin:0 auto; padding:0 calc(var(--pad)*1.2) 60px}
.desk{
  position:relative; width:100%; min-height:130vh; overflow:visible;
  background:
    radial-gradient(1200px 400px at 30% -10%, #fafafa 0%, transparent 60%),
    radial-gradient(1200px 400px at 70% 110%, #fafafa 0%, transparent 60%);
  padding-top: calc(var(--title-offset) + 24px); /* room for title + some breathing */
}

/* floating single-color ransom page title (always beneath the bar) */
.scrap-title{
  position:absolute; left:50%; top:var(--title-offset); transform:translateX(-50%);
  display:flex; gap:6px; z-index:40; pointer-events:none;
}
.scrap-title .tile{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.color-blue   .scrap-title .tile{--paper:color-mix(in oklab, var(--c-blue) 24%, white)}
.color-coral  .scrap-title .tile{--paper:color-mix(in oklab, var(--c-coral) 24%, white)}
.color-green  .scrap-title .tile{--paper:color-mix(in oklab, var(--c-green) 24%, white)}
.color-purple .scrap-title .tile{--paper:color-mix(in oklab, var(--c-purple) 24%, white)}

/* stickers: pure PNG/VIDEO, no frames */
.sticker{position:absolute; border:none; background:transparent; cursor:grab; user-select:none; touch-action:none; transition:transform .08s ease}
.sticker:hover{transform:translate3d(var(--tx,0),var(--ty,0),0) scale(1.02)}
.sticker:active{cursor:grabbing}
.sticker img, .sticker video{display:block; width:100%; height:auto; pointer-events:none; background:transparent}

/* Lightbox */
.lb{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.85); z-index:80}
.lb.active{display:flex}
.lb-inner{position:relative}
.lb img, .lb video{max-width:92vw; max-height:90vh; display:block; box-shadow:0 10px 28px rgba(0,0,0,.35); border:none}
.lb button{position:absolute; right:-8px; top:-48px; padding:10px 12px; background:#fff; border:none; font-weight:700; border-radius:10px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.12)}

/* helper */
.helper{position:fixed; right:12px; bottom:12px; z-index:60; background:#fff; border:1px solid #e5e5e5; border-radius:10px; padding:8px 10px; font:12px/1.2 var(--font); display:none; box-shadow:0 6px 18px rgba(0,0,0,.12)}
.helper.active{display:block}
</style>

<script>
/* Router */
function syncPages(){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const t = document.querySelector(location.hash || '#home');
  if(t && t.classList.contains('page')){ t.classList.add('active'); t.scrollIntoView({behavior:'auto', block:'start'}); }
}
addEventListener('hashchange', syncPages);
addEventListener('load', syncPages);

/* Build ransom titles (spaces become gaps, not tiles) */
function buildScrap(el){
  const word = (el.getAttribute('data-word')||'');
  el.innerHTML = '';
  [...word].forEach(ch=>{
    if(ch === ' '){
      const gap = document.createElement('span');
      gap.style.display='inline-block';
      gap.style.width='14px';
      gap.style.height='1px';
      el.appendChild(gap);
      return;
    }
    const t = document.createElement('span');
    t.className='tile';
    t.style.setProperty('--r', (Math.random()*4-2)+'deg');
    const s = document.createElement('span'); s.textContent = ch.toUpperCase();
    t.appendChild(s); el.appendChild(t);
  });
}
function buildAllTitles(){ document.querySelectorAll('.scrap-title').forEach(buildScrap); }
addEventListener('load', buildAllTitles);
addEventListener('hashchange', ()=>{
  const active = document.querySelector('.page.active .scrap-title');
  if(active && !active.children.length) buildScrap(active);
});

/* Home collage: assemble + reveal hotspots */
addEventListener('load', ()=>{
  const p = document.getElementById('homePuzzle');
  const scene = document.getElementById('sceneHome');
  if(p){ p.classList.add('assembled'); setTimeout(()=> scene.classList.remove('hotspots-hidden'), 900); }
});

/* Hotspot zoom → page */
const overlay=document.getElementById('zoomOverlay');
function zoomNavigate(fromEl,targetHash){
  const rect=fromEl.getBoundingClientRect();
  overlay.innerHTML='';
  const piece=document.createElement('div');
  piece.className='zoom-piece';
  Object.assign(piece.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',background:'#fff'});
  overlay.classList.add('active'); overlay.appendChild(piece);
  const vw=innerWidth,vh=innerHeight; const scale=Math.max(vw/rect.width,vh/rect.height)*1.05;
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2; const tx=vw/2-cx, ty=vh/2-cy;
  piece.style.transition=`transform var(--zoom-ms) cubic-bezier(.2,.7,.18,1)`;
  requestAnimationFrame(()=> piece.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`);
  setTimeout(()=>{ location.hash=targetHash; overlay.classList.remove('active'); overlay.innerHTML=''; }, 560);
}
document.querySelectorAll('.hotspot').forEach(h=>{
  h.addEventListener('click', e=>{ e.preventDefault(); zoomNavigate(h, h.dataset.target); });
});

/* Hotspot helper (press H) */
let helperOn=false; const helper=document.getElementById('helper');
addEventListener('keydown', e=>{
  if(e.key.toLowerCase()==='h'){
    helperOn=!helperOn; helper.classList.toggle('active', helperOn);
    helper.textContent = helperOn ? 'H: ON — move over collage, click to copy' : 'H: off — press H to enable';
  }
});
document.querySelectorAll('#sceneHome .puzzle').forEach(imgWrap=>{
  imgWrap.addEventListener('mousemove', e=>{
    if(!helperOn) return;
    const r=imgWrap.getBoundingClientRect();
    const left=((e.clientX-r.left)/r.width*100).toFixed(2);
    const top =((e.clientY-r.top )/r.height*100).toFixed(2);
    helper.textContent=`left:${left}%; top:${top}%; (click to copy)`;
  });
  imgWrap.addEventListener('click', e=>{
    if(!helperOn) return;
    const r=imgWrap.getBoundingClientRect();
    const left=((e.clientX-r.left)/r.width*100).toFixed(2);
    const top =((e.clientY-r.top )/r.height*100).toFixed(2);
    const text=`left:${left}%; top:${top}%;`;
    navigator.clipboard?.writeText(text); helper.textContent=`copied: ${text}`; e.preventDefault();
  });
});

/* Stickers: drag vs click (zoom) */
(function(){
  const lb = document.getElementById('lb');
  const lbInner = document.getElementById('lbInner');

  function openLB(el){
    lbInner.innerHTML='';
    const media = el.cloneNode(true);
    if(media.tagName.toLowerCase()==='video'){ media.controls=true; media.muted=false; }
    lbInner.appendChild(media);
    const btn=document.createElement('button'); btn.textContent='Close ✕'; btn.addEventListener('click', closeLB);
    lbInner.appendChild(btn);
    lb.classList.add('active');
  }
  function closeLB(){ lb.classList.remove('active'); lbInner.innerHTML=''; }
  lb.addEventListener('click', e=>{ if(e.target===lb) closeLB(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLB(); });

  function initDesk(desk){
    let drag=null, startX=0, startY=0, baseX=0, baseY=0, moved=false, raf=null;

    function setTransform(el,x,y){
      el.style.setProperty('--tx', x+'px');
      el.style.setProperty('--ty', y+'px');
      el.style.transform=`translate3d(${x}px,${y}px,0)`;
    }

    desk.querySelectorAll('.sticker').forEach(box=>{
      box.dataset.tx='0'; box.dataset.ty='0';
      const media = box.querySelector('img,video');
      if(media) media.draggable=false;

      function onDown(e){
        drag = box; moved=false;
        startX = e.clientX; startY = e.clientY;
        baseX = parseFloat(box.dataset.tx||'0'); baseY = parseFloat(box.dataset.ty||'0');
        box.setPointerCapture(e.pointerId);
        box.style.zIndex = (parseInt(box.style.zIndex||'10',10)+1).toString();
      }
      function onMove(e){
        if(!drag) return;
        const dx = e.clientX - startX, dy = e.clientY - startY;
        if(Math.abs(dx)>4 || Math.abs(dy)>4) moved=true;
        const nx = baseX + dx, ny = baseY + dy;
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(()=> setTransform(drag, nx, ny));
        drag.dataset.tx = nx; drag.dataset.ty = ny;
      }
      function onUp(e){
        if(!drag) return;
        drag.releasePointerCapture(e.pointerId);
        const wasClick = !moved;
        const mediaEl = drag.querySelector('img,video');
        drag=null;
        if(wasClick && mediaEl){ openLB(mediaEl); }
      }

      box.addEventListener('pointerdown', onDown);
      box.addEventListener('pointermove', onMove);
      box.addEventListener('pointerup',   onUp);
      box.addEventListener('pointercancel', onUp);
    });
  }

  document.querySelectorAll('.desk').forEach(initDesk);
})();
</script>
